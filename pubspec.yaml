name: sosecure
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^17.1.0
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  geolocator: any
  google_maps_flutter: any
  permission_handler: any
  freezed_annotation: any
  json_annotation: any
  logger: any
  uuid: any
  google_fonts: any
  flutter_native_splash: any
  url_launcher: any
  firebase_messaging: any
  flutter_local_notifications: ^18.0.0
  flutter_sound: ^9.13.0
  firebase_storage: any
  path_provider: any
  just_audio: ^0.9.36

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.13.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#2563EB"
  image: assets/images/app_logo.png
  color_dark: "#0F172A"
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#2563EB"
    color_dark: "#0F172A"
    icon_background_color: "#2563EB"
    icon_background_color_dark: "#0F172A"
